name: wear_health_measure
description: >-
  Live sensor readings (heart rate, steps, ...) on Wear OS via the Health
  Services MeasureClient, without starting an exercise session.
version: 0.1.0
repository: https://github.com/codivo-erill/wear_health_measure
issue_tracker: https://github.com/codivo-erill/wear_health_measure/issues
topics:
  - wear-os
  - health
  - heart-rate
  - sensors
  - android

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

platforms:
  android:

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: de.codivo.wear_health_measure
        pluginClass: WearHealthMeasurePlugin
